<!doctype html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StageEgo - Chat with any character, your way. A two-sided AI character chatbot: switch freely between characters in Generic Mode, or lock in for an immersive one-on-one in Personality Mode." />
    <meta name="theme-color" content="#0f172a" />
    <meta name="keywords" content="AI character chat, roleplay chatbot, character AI, personality chat, custom AI characters" />
    <title>StageEgo</title>
    <style>
        /* Phase 10: critical inline CSS for the pre-React app shell.
           Kept deliberately tiny and self-contained (no external
           stylesheet dependency) so it can paint before any JS,
           including the main bundle, has loaded or executed. Mirrors
           the dark theme (#0f172a) so there's no flash-of-wrong-color
           when the real app mounts on top of it. */
        html { background: #0f172a; margin: 0; height: 100%; }
        body { margin: 0; height: 100%; }
        #app-shell {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #0f172a;
            color: #cbd5e1;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #app-shell .shell-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            opacity: 0.9;
        }
        /* Launch mark: the brand logo drawing itself in, then a slow
           breathing glow, instead of a generic borrowed spinner. Pure
           inline SVG + CSS so it paints before any JS loads. */
        #app-shell .shell-mark {
            width: 64px;
            height: 64px;
            filter: drop-shadow(0 0 18px rgba(20, 184, 166, 0.45));
            animation: shell-breathe 2.4s ease-in-out infinite;
        }
        #app-shell .shell-mark .draw {
            stroke-dasharray: 190;
            stroke-dashoffset: 190;
            animation: shell-draw 1.1s ease-out forwards;
        }
        #app-shell .shell-mark .fill {
            opacity: 0;
            animation: shell-fill 0.7s ease-out 0.5s forwards;
        }
        @keyframes shell-draw { to { stroke-dashoffset: 0; } }
        @keyframes shell-fill { to { opacity: 1; } }
        @keyframes shell-breathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 14px rgba(20, 184, 166, 0.35)); }
            50%      { transform: scale(1.04); filter: drop-shadow(0 0 26px rgba(20, 184, 166, 0.6)); }
        }
        /* Thin progress sweep under the mark - communicates "loading"
           without another spinning circle. */
        #app-shell .shell-bar {
            width: 132px;
            height: 2px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
        }
        #app-shell .shell-bar::after {
            content: '';
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, #14b8a6, #06b6d4, transparent);
            animation: shell-sweep 1.3s ease-in-out infinite;
        }
        @keyframes shell-sweep {
            0%   { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }
        @media (prefers-reduced-motion: reduce) {
            #app-shell .shell-mark,
            #app-shell .shell-mark .draw,
            #app-shell .shell-mark .fill { animation: none; opacity: 1; stroke-dashoffset: 0; }
            #app-shell .shell-bar::after { animation: none; width: 100%; }
        }
        /* Once React mounts, App.tsx adds this class to <body> so the
           shell fades out instead of hard-cutting to the real UI. */
        body.app-ready #app-shell { opacity: 0; pointer-events: none; transition: opacity 0.2s ease-out; }
    </style>
</head>

<body>
    <div id="app-shell" aria-hidden="true">
        <svg class="shell-mark" viewBox="0 0 48 48" fill="none">
            <defs>
                <linearGradient id="shellGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#14b8a6"/>
                    <stop offset="100%" stop-color="#06b6d4"/>
                </linearGradient>
            </defs>
            <path class="draw" d="M30 8c6.6 0 11 4 11 10 0 8.5-4.2 17-11 20.5-1.6.8-3.2 1.2-4.6 1.2"
                  stroke="url(#shellGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.45" fill="none"/>
            <g class="fill">
                <path d="M18 7c-7.2 0-12 4.4-12 11 0 9.4 4.6 18.7 12 22.6C25.4 36.7 30 27.4 30 18c0-6.6-4.8-11-12-11z"
                      fill="url(#shellGrad)"/>
                <path d="M12.5 17.5c1.6-1.4 3.6-1.4 5 0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M19.5 17.5c1.6-1.4 3.6-1.4 5 0" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>
                <path d="M13 26c2.2 3.4 7.8 3.4 10 0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" fill="none"/>
            </g>
        </svg>
        <div class="shell-title">StageEgo</div>
        <div class="shell-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
